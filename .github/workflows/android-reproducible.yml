name: Android reproducible build

on:
  # Called by the release pipeline, where it gates publication — see
  # `androidReproducible` in build.yml. Not run per pull request any more: it
  # is two independent builds, which is too much work to hold every
  # change that touches `lib/` for a property only a release can act on. What it
  # protects is the F-Droid contract — F-Droid rebuilds
  # from this source and compares against the published APK — so the release is
  # the moment it has to hold, and the release is where it now runs.
  workflow_call:
  # For checking a change that is likely to break it without waiting for a tag:
  # anything under `android/`, the build scripts, or a dependency bump.
  workflow_dispatch:
  # Weekly on main, because what breaks reproducibility lands between releases:
  # a Flutter, NDK or Gradle plugin bump, a dependency that started embedding a
  # path or a timestamp. Without this the first anyone hears of it is the tag,
  # which is the worst moment — someone is trying to ship. One run a week costs
  # nothing and no pull request waits for it.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  build:
    name: Independent build ${{ matrix.instance }} (arm64)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - instance: one
            source_directory: source-one
            cache_directory: cache-one
          - instance: two
            source_directory: a/different-length/source-two
            cache_directory: a/different-length/cache-two
    env:
      ABI: arm64
      NATIVE_TARGET: android_arm64
      JNI_ABI: arm64-v8a
      APK_NAME: app-arm64-v8a-release-unsigned.apk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-flutter

      - name: Create a path-independent source tree
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/${{ matrix.source_directory }}"
          mkdir -p "$(dirname "$source_dir")"
          cp -a "$GITHUB_WORKSPACE" "$source_dir"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install the pinned Android SDK and NDK
        shell: bash
        working-directory: ${{ runner.temp }}/${{ matrix.source_directory }}
        run: |
          set -euo pipefail
          compile_sdk="$(tr -d '[:space:]' < android/compile-sdk-version.txt)"
          build_tools="$(tr -d '[:space:]' < android/build-tools-version.txt)"
          ndk_version="$(tr -d '[:space:]' < android/ndk-version.txt)"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" \
            "platforms;android-$compile_sdk" \
            "build-tools;$build_tools" \
            "ndk;$ndk_version"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"

      - name: Fix the build epoch
        shell: bash
        working-directory: ${{ runner.temp }}/${{ matrix.source_directory }}
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Prepare the offline build
        shell: bash
        working-directory: ${{ runner.temp }}/${{ matrix.source_directory }}
        env:
          FDROID_CACHE_DIR: ${{ runner.temp }}/${{ matrix.cache_directory }}
        run: scripts/release/prepare-fdroid.sh "$ABI"

      - name: Build unsigned split APK without network access
        shell: bash
        working-directory: ${{ runner.temp }}/${{ matrix.source_directory }}
        env:
          FDROID_CACHE_DIR: ${{ runner.temp }}/${{ matrix.cache_directory }}
          FDROID_OFFLINE: "true"
        run: scripts/release/build-fdroid.sh "$ABI"

      - name: Check ABI isolation and native path remapping
        shell: bash
        working-directory: ${{ runner.temp }}/${{ matrix.source_directory }}
        run: |
          set -euo pipefail
          apk="build/app/outputs/apk/release/${APK_NAME}"
          manifest="$RUNNER_TEMP/NativeAssetsManifest-${{ matrix.instance }}-${ABI}.json"

          unzip -p "$apk" assets/flutter_assets/NativeAssetsManifest.json > "$manifest"
          jq -e --arg target "${NATIVE_TARGET}" \
            '(."native-assets" | keys) == [$target]' "$manifest" > /dev/null || {
              echo "::error::native assets are not isolated to ${NATIVE_TARGET}"
              jq '."native-assets" | keys' "$manifest"
              exit 1
            }

          # Every library a build hook compiles from Rust (and the C its
          # crates bring along).
          for name in libsbm_ffi libfl_pi_llm; do
            library="$RUNNER_TEMP/$name-${{ matrix.instance }}-${ABI}.so"
            unzip -p "$apk" "lib/${JNI_ABI}/$name.so" > "$library"
            for forbidden in \
              "$RUNNER_TEMP/${{ matrix.source_directory }}" \
              "$HOME/.cargo"; do
              if grep -aFq -- "$forbidden" "$library"; then
                echo "::error::$name.so contains host path: $forbidden"
                exit 1
              fi
            done
          done

      - name: Upload unsigned APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-unsigned-${{ matrix.instance }}-arm64
          path: ${{ runner.temp }}/${{ matrix.source_directory }}/build/app/outputs/apk/release/${APK_NAME}
          if-no-files-found: error
          retention-days: 7

  compare:
    name: Compare independent APKs (arm64)
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Download first build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-unsigned-one-arm64
          path: artifacts/one

      - name: Download second build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-unsigned-two-arm64
          path: artifacts/two

      - name: Require byte-identical APKs
        shell: bash
        run: scripts/release/compare-apks.sh artifacts/one artifacts/two apk-diffoscope-arm64.txt

      - name: Diagnose a reproducibility failure
        if: failure()
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope
          scripts/release/compare-apks.sh artifacts/one artifacts/two apk-diffoscope-arm64.txt || true

      - name: Upload diffoscope report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reproducibility-diff-arm64
          path: apk-diffoscope-arm64.txt
          if-no-files-found: ignore
          retention-days: 14
