name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release from the selected v1.0.<build> tag'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  BUILD_TAG: test-build-${{ github.run_number }}-${{ github.sha }}

jobs:
  reproducibilityCheck:
    # Static build-input validation.
    name: Build input checks
    runs-on: ubuntu-latest
    outputs:
      # What the artifacts are called, read from the one line that says so —
      # `fl_build:` in pubspec.yaml. `fl_build` names the files it produces
      # after it and the steps below name the files they publish, so a second
      # copy here that drifted would publish a release whose asset paths match
      # nothing, which `action-gh-release` reports as a warning and an empty
      # release rather than as a failure.
      appName: ${{ steps.appName.outputs.name }}
      # The version every job names its artifacts after. Resolved once, here,
      # because a build renaming with an empty `BUILD_NUMBER` looks for
      # `*__*.apk` and its release paths for `v1.0.`, and
      # `action-gh-release` reports a warning rather than a failure.
      buildNumber: ${{ steps.buildNumber.outputs.build }}
      # Whether this run publishes. `github.ref_type == 'tag'` alone was true
      # of a manual dispatch against a tag with the release box unticked, which
      # is the one case the box exists to say no to.
      isRelease: ${{ steps.buildNumber.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
      - name: Require tagged releases
        if: inputs.release == true && github.ref_type != 'tag'
        shell: bash
        run: |
          echo "Release builds must be started from a committed tag so the source can be reproduced by downstream builders."
          echo "Create and push a v1.0.<build> tag after committing the release version files."
          exit 1
      - name: Check tag source version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          build_data="$(sed -n -E 's/.*static const int build = ([0-9]+);/\1/p' lib/data/res/build_data.dart | head -n 1)"
          pub_version="$(sed -n -E 's/^version:[[:space:]]*([^+]+)\+([0-9]+)$/\1+\2/p' pubspec.yaml | head -n 1)"

          if [[ -z "$build_data" ]]; then
            echo "::error::BuildData.build not found in lib/data/res/build_data.dart"
            exit 1
          fi

          # The whole tag, not the number on the end of it. Everything
          # downstream writes `v1.0.<build>` out by hand — the artifact names in
          # the Android job, and the tag `publishRelease` opens the release
          # on — while this compared only `${GITHUB_REF_NAME##*.}` and never the
          # `1.0.` in front of it.
          expected_tag="v1.0.${build_data}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::this workflow publishes ${expected_tag}, but the tag is ${GITHUB_REF_NAME}."
            echo "Push ${expected_tag}, or set BuildData.build to the tag's build number."
            exit 1
          fi

          if [[ "$pub_version" != "1.0.${build_data}+${build_data}" ]]; then
            echo "::error::pubspec.yaml version must be 1.0.${build_data}+${build_data}; got ${pub_version}."
            exit 1
          fi
      - name: Check locked dependencies
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock
      - name: Check JNI build-id patch
        shell: bash
        run: scripts/release/patch-jni-build-id.sh
      - name: Read the app name
        id: appName
        shell: bash
        run: |
          set -euo pipefail
          # `yq eval`, which is mikefarah's — the one on the Linux runner
          # images, and the one the Flutter setup action calls the same way.
          # It only installs its own for Windows, which is where it is missing.
          name="$(yq eval '.fl_build.appName' pubspec.yaml)"
          # An absent key reads back as the string `null`, and a release named
          # after it would publish under `null_v1.0.<n>_arm64.apk` rather than
          # fail.
          if [[ -z "$name" || "$name" == 'null' ]]; then
            echo "::error::pubspec.yaml has no fl_build.appName"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "app name: $name"
      - name: Resolve build number
        id: buildNumber
        shell: bash
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          WANTS_RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          build="$(sed -n -E 's/.*static const int build = ([0-9]+);/\1/p' lib/data/res/build_data.dart | head -n 1)"
          if [[ -z "$build" ]]; then
            echo "::error::BuildData.build not found in lib/data/res/build_data.dart"
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

          # A tag push always releases; a dispatch only when asked.
          release=false
          if [[ "$WANTS_RELEASE" == 'true' ]]; then
            release=true
          elif [[ "$IS_DISPATCH" != 'true' && "$GITHUB_REF_TYPE" == 'tag' ]]; then
            release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "build $build, release $release"

  buildAndroid:
    name: Build Android (arm64)
    needs: reproducibilityCheck
    # From pubspec.yaml's `fl_build:`, by way of the job above — see its
    # `appName`
    # output. Job level rather than workflow level because that is the
    # nearest scope an expression on `needs` can be written in.
    env:
      APP_NAME: ${{ needs.reproducibilityCheck.outputs.appName }}
      BUILD_NUMBER: ${{ needs.reproducibilityCheck.outputs.buildNumber }}
    runs-on: ubuntu-latest
    # Publication is one job, and it is the only one that needs to write.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Fix the Android build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Install the pinned Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="$(tr -d '[:space:]' < android/ndk-version.txt)"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "ndk;$ndk_version"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk_version" >> "$GITHUB_ENV"
      - name: Fetch secrets
        # Through the environment, and quoted. Expanded into the script the way
        # they were, a space or a shell metacharacter in either value is parsed
        # as script rather than as part of the value.
        env:
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}
          URL_PREFIX: ${{ secrets.URL_PREFIX }}
        run: |
          set -euo pipefail
          curl --fail --show-error --location -u "$BASIC_AUTH" -o android/app/app.key "${URL_PREFIX}app.key"
          curl --fail --show-error --location -u "$BASIC_AUTH" -o android/key.properties "${URL_PREFIX}key.properties"
      - name: Patch JNI build-id
        run: |
          flutter pub get
          scripts/release/patch-jni-build-id.sh
      # The Linux userland the terminal tab offers. Not in the repository —
      # these are binaries, and they are built from pinned upstream sources
      # here. Without this step the feature is absent from the build rather
      # than broken in it, which is why the check below exists.
      - name: Build proot
        shell: bash
        run: scripts/build-proot-android.sh
      - name: Build (release)
        if: needs.reproducibilityCheck.outputs.isRelease == 'true'
        shell: bash
        run: dart run fl_build -bp -p android -- --target-platform=android-arm64
      - name: Build (test)
        if: needs.reproducibilityCheck.outputs.isRelease != 'true'
        shell: bash
        run: dart run fl_build -p android -- --target-platform=android-arm64
      # `useLegacyPackaging` off means nothing is extracted from the APK, so
      # `nativeLibraryDir` does not exist and proot cannot be run from
      # anywhere. The APK still builds, installs and runs — the rootfs entry
      # simply never appears. Checked here because nothing else would say so.
      - name: Check proot shipped
        shell: bash
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*_arm64.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "no arm64 APK was built"; exit 1; }
          for apk in "${apks[@]}"; do
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libproot.so' ||
              { echo "$apk carries no proot; the Linux userland would be missing"; exit 1; }
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libproot-loader.so' ||
              { echo "$apk carries proot but not its loader; entering the rootfs would be refused"; exit 1; }
          done
      - name: Rename
        shell: bash
        run: |
          cd build/app/outputs/flutter-apk
          for f in *_"${BUILD_NUMBER}"_*.apk; do
            mv "$f" "${f/_${BUILD_NUMBER}_/_v1.0.${BUILD_NUMBER}_}"
          done
          # Remove original APKs copied by fl_build
          rm -f app-*-release.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.BUILD_TAG }}-android-arm64
          path: build/app/outputs/flutter-apk/${{ env.APP_NAME }}_v1.0.${{ env.BUILD_NUMBER }}_arm64.apk
          if-no-files-found: error
          retention-days: 14
      # A native crash reaches us as a tombstone full of addresses, and these
      # are the only thing they resolve against. Not a release asset: users
      # have no use for them, and `publishRelease` checks the asset list.
      - name: Name native debug symbols
        shell: bash
        run: |
          mv build/app/outputs/native-debug-symbols/release/native-debug-symbols.zip \
            build/app/outputs/native-debug-symbols/release/native-debug-symbols-arm64.zip
      - name: Upload native debug symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.APP_NAME }}-${{ env.BUILD_TAG }}-android-arm64-symbols
          path: build/app/outputs/native-debug-symbols/release/native-debug-symbols-arm64.zip
          if-no-files-found: error
          retention-days: 90

  # The one job that publishes, and the only one with a write-capable token.
  #
  # `needs` every build job, which a skipped or failed one fails; assemble
  # the assets from their artifacts; refuse if the set is not complete; create
  # the release as a **draft** and only then publish it. A failure anywhere
  # before that last step leaves a draft, which is not a release anyone can
  # download.
  publishRelease:
    name: Publish the release
    if: needs.reproducibilityCheck.outputs.isRelease == 'true'
    needs:
      - reproducibilityCheck
      - buildAndroid
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_NAME: ${{ needs.reproducibilityCheck.outputs.appName }}
      BUILD_NUMBER: ${{ needs.reproducibilityCheck.outputs.buildNumber }}
      # Built from the build number rather than read from `github.ref_name`, so
      # it is the same expression the Android job names its file with. The two
      # are only interchangeable because `Check tag source version` refuses a
      # tag that is not exactly this; without that check this opened a release
      # on a tag nobody pushed.
      TAG: v1.0.${{ needs.reproducibilityCheck.outputs.buildNumber }}
    steps:
      - name: Collect the platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: ${{ env.APP_NAME }}-${{ env.BUILD_TAG }}-*
          path: assets
          merge-multiple: true
      # The complete set, named here because this is the only place that can
      # know it. The build job knows about its own file and answers for that;
      # a job that never ran has no files and no complaint to make.
      #
      # It also decides what does *not* ship. The download pattern above is a
      # glob over every artifact this run produced, and one of them is the
      # debug-symbols bundle — `-android-arm64-symbols` — which
      # `merge-multiple` flattens in beside the APK. `files: assets/*` would
      # then publish `native-debug-symbols.zip` as a release asset, which the
      # job producing it explicitly says it is not.
      - name: Check every expected asset arrived
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            "${APP_NAME}_${TAG}_arm64.apk"
          )

          echo "collected:"
          ls -la assets

          missing=()
          for name in "${expected[@]}"; do
            [ -f "assets/$name" ] || missing+=("$name")
          done

          if (( ${#missing[@]} )); then
            echo "::error::the release is incomplete, ${#missing[@]} asset(s) missing: ${missing[*]}"
            exit 1
          fi

          # Everything that is not on the list, including the symbol bundle.
          # `-depth` so a directory's contents are removed before the directory
          # holding them, and `-print0` so a name with a space survives the
          # read.
          while IFS= read -r -d '' path; do
            name="${path#assets/}"
            keep=false
            for want in "${expected[@]}"; do
              if [[ "$name" == "$want" ]]; then keep=true; break; fi
            done
            if [[ "$keep" == false ]]; then rm -rf "$path"; fi
          done < <(find assets -depth -mindepth 1 -print0)

          echo "publishing:"
          ls -la assets
      # For checking a download by hand: a checksum next to the file is what
      # there is to go by. After the pruning above, so it lists exactly what
      # is published.
      - name: Write checksums
        shell: bash
        working-directory: assets
        run: |
          set -euo pipefail
          files=(*)
          sha256sum -- "${files[@]}" > SHA256SUMS
          md5sum -- "${files[@]}" > MD5SUMS
          cat SHA256SUMS MD5SUMS
      # As a draft, so nothing is downloadable until the step below says so.
      # `action-gh-release` sends `draft` on an update too, so a second call
      # without it would publish the release — which is exactly what the step
      # below is for.
      - name: Stage the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
